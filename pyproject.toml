[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "NeuralFieldManifold"
version = "0.1.0"
description = "Tools for simulating stochastic processes, chaotic systems, and time-varying autoregressive models"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24,<3",
    "scipy>=1.10",
    "matplotlib>=3.7",
    "pandas>=2.0",
    "jax>=0.4.20",
    "jaxlib>=0.4.20",
    "flax>=0.7",
    "optax>=0.1.7",
    "torch>=2.0",
    "mne>=1.4",
    "statsmodels>=0.14",
    "PyWavelets>=1.4",
    "seaborn>=0.13",
    "plotly>=5.15",
    "tqdm>=4.65",
    "scikit-learn>=1.4",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "ipython",
    "ipykernel",
    "ipywidgets==8.1.8",
    "ipympl==0.10.0",
]
docs = [
    "Sphinx==9.1.0",
    "sphinx-book-theme==1.1.4",
    "sphinx-autodoc-typehints==3.6.2",
    "myst-nb==1.3.0",
    "myst-parser==5.0.0",
    "nbclient==0.10.4",
    "jupyter-cache==1.0.1",
]

[tool.setuptools.packages.find]
include = ["NeuralFieldManifold*"]
