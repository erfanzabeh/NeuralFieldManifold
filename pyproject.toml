[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "neuralfieldmanifold"
version = "0.1.0"
description = "Delay geometry and time-varying autoregressive models for neural field signals"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
dependencies = ["numpy>=1.24,<3", "scipy>=1.10", "torch>=2.0"]

[project.optional-dependencies]
plot = ["matplotlib>=3.7", "plotly>=5.15"]
tutorials = ["matplotlib>=3.7", "plotly>=5.15", "scikit-learn>=1.4", "ipykernel", "ipywidgets>=8", "nbformat>=5", "nbclient>=0.10"]
docs = ["sphinx>=7,<9", "myst-nb>=1", "sphinx-book-theme>=1"]
dev = ["build"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
neuralfieldmanifold = ["datasets/*.npz"]
